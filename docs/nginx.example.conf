# peer-to-file behind nginx (TLS-terminating reverse proxy)
#
# peer-to-file has NO authentication. Either bind this listener to an
# interface only your VPN peers can reach (as below), or add auth at the
# proxy level (basic_auth, client certificates, ...). TLS alone does not
# protect anything.
#
# Matching app configuration:
#   P2F_HOST=127.0.0.1                          # only nginx reaches the app
#   P2F_PUBLIC_URL=https://files.example.com    # what clients see
#
# With P2F_PUBLIC_URL set, everything (client, API, webseed, tracker
# WebSocket) flows through this single upstream on P2F_PORT — the separate
# tracker port does not need to be exposed.

server {
    # Bind the VPN interface IP — never a publicly routable address.
    listen 10.0.0.1:443 ssl;
    http2 on;
    server_name files.example.com;

    ssl_certificate     /etc/nginx/certs/files.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/files.example.com.key;

    # Tracker WebSocket: peer discovery + WebRTC signaling.
    location /tracker {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Announces are periodic (minutes apart) — don't cut idle sockets,
        # or downloads lose their signaling channel mid-transfer.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Web client, browse API and the HTTP webseed (Range requests).
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream large ranged webseed responses instead of buffering to disk.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
