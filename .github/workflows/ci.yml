name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      # F11: surface known-vulnerable production dependencies. Non-blocking for
      # now (|| true) so a fresh advisory doesn't wedge unrelated PRs; tighten
      # to a hard fail once the baseline is clean.
      - run: npm audit --omit=dev || true

  e2e:
    name: browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # the e2e script imports playwright-core; the playwright package brings
      # a matching playwright-core plus the browser installer
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      # login -> browse -> download -> pause (zero bandwidth) -> server
      # restart resume -> page reload resume (OPFS) -> checksum
      - run: npm run e2e

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # the image build re-runs typecheck + client build in a clean
      # environment and verifies native prebuilds resolve for the base image
      - run: docker build .
