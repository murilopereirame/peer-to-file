name: Apps - Build

# Ad-hoc only (workflow_dispatch) — these are unsigned/dev builds meant for
# "does it still compile and run" checks and internal sideloading, not app
# store releases. Real signing (Apple notarization, Windows Authenticode) is
# intentionally out of scope here; see apps/README.md for how to add it once
# you have your own credentials.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch, tag or commit SHA to build
        type: string
        default: main

concurrency:
  group: apps-build-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop - Electron (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build (electron-builder)
        working-directory: apps/desktop
        run: npm run build
        # electron-builder ad-hoc signs macOS builds automatically when no
        # signing identity is configured (needed for arm64 to launch at
        # all) — see "Opening the macOS build" in apps/README.md.

      - uses: actions/upload-artifact@v7
        with:
          name: p2file-desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
          if-no-files-found: warn
