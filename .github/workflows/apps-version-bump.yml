name: Apps - Version Bump

# Ad-hoc only: a version bump is a deliberate release decision, not
# something that should fire on every push. Bumps apps/desktop and
# packages/shared in lockstep and pushes the result as a commit + tag. Does
# not touch the original web app's root package.json/version.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to bump and push the version commit/tag to
        type: string
        default: main
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: apps-version-bump-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump apps version (${{ inputs.bump }}) on ${{ inputs.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(node apps/scripts/bump-version.mjs "${{ inputs.bump }}")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json packages/shared/package.json
          git commit -m "chore(apps): bump version to v${{ steps.bump.outputs.version }}"
          git tag "apps-v${{ steps.bump.outputs.version }}"
          git push origin "HEAD:${{ inputs.branch }}"
          git push origin "apps-v${{ steps.bump.outputs.version }}"

      - name: Summary
        run: echo "### Bumped apps to v${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
