<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>peer-to-file — logs</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128230;</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script defer src="logs.js"></script>
</head>
<body>
  <header>
    <div class="title-row">
      <h1>peer-to-file — logs</h1>
      <a href="index.html">&larr; back to browser</a>
    </div>
    <div id="conn-status" class="status"></div>
  </header>

  <main>
    <section id="logs-controls">
      <label>
        kind
        <select id="kind-filter">
          <option value="">all</option>
          <option value="connection">connections</option>
          <option value="tracker">tracker</option>
          <option value="torrent">torrent requests</option>
          <option value="webseed">webseed</option>
          <option value="auth">auth</option>
          <option value="server">server</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="auto-refresh" checked>
        auto-refresh
      </label>
      <button id="clear-view" type="button">Clear view</button>
    </section>

    <ul id="log-list"></ul>
  </main>
</body>
</html>
